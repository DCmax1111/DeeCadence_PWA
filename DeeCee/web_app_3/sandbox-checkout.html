<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeeCee Sandbox Checkout</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080c14;
      --panel: #111827;
      --line: #2b3a55;
      --text: #f8fbff;
      --muted: #9da8bd;
      --blue: #5ea1ff;
      --green: #35d990;
      --red: #ff6b76;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 0%, rgba(94, 161, 255, .22), transparent 30%), var(--bg);
      color: var(--text);
    }
    main {
      width: min(520px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      background: linear-gradient(135deg, rgba(17, 24, 39, .96), rgba(7, 10, 18, .96));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .45);
    }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3rem); }
    p { color: var(--muted); line-height: 1.6; }
    code {
      display: block;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--blue);
      overflow-wrap: anywhere;
    }
    .row { display: grid; gap: 12px; margin-top: 20px; }
    button, a {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 16px;
      background: #0d1424;
      color: var(--text);
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    button.primary { border-color: var(--green); background: rgba(53, 217, 144, .16); }
    button.danger { border-color: var(--red); background: rgba(255, 107, 118, .14); }
    .notice { min-height: 24px; color: var(--blue); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>DeeCee Sandbox</h1>
    <p>This test checkout simulates a provider-hosted payment page. It calls DeeCee's server endpoint, which signs and processes the same webhook path used for payment verification.</p>
    <code id="reference">Loading reference...</code>
    <div class="row">
      <button class="primary" data-status="successful">Complete Test Payment</button>
      <button data-status="failed">Fail Test Payment</button>
      <button class="danger" data-status="abandoned">Abandon Payment</button>
      <a href="./index.html#settings">Return to DeeCee</a>
    </div>
    <p class="notice" id="notice"></p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const reference = params.get("reference") || "";
    const notice = document.querySelector("#notice");
    document.querySelector("#reference").textContent = reference || "Missing payment reference";

    document.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-status]");
      if (!button || !reference) return;
      button.disabled = true;
      notice.textContent = "Processing sandbox payment...";
      try {
        const response = await fetch("/api/sandbox/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reference, status: button.dataset.status })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || "Payment simulation failed");
        notice.textContent = `Payment status: ${payload.status}. Returning to DeeCee...`;
        setTimeout(() => { window.location.href = "./index.html#settings"; }, 1100);
      } catch (error) {
        notice.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
